name: 🔧 Update server proxy (mihomo)

# =============================================================================
# 更新服务器宿主机 mihomo/clash 订阅配置并验证出站连通性
#   1. runner 拉取 PROXY_SUB_URL 指向的 Clash 订阅(URL 存于仓库 Secret,不落日志)
#   2. SSH 到服务器:自动发现 mihomo(systemd/docker)与配置目录,备份旧配置
#   3. 安装新配置,打补丁 allow-lan: true(容器经 host.docker.internal 走代理必须)
#   4. 重启 mihomo,验证 ghcr.io 经代理可达、docker daemon 可拉取
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: '只诊断不更新 (true/false)'
        required: false
        default: 'false'

concurrency:
  group: proxy-update
  cancel-in-progress: false

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/telos' }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 加载 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "$SSH_HOST_KEY" ]]; then
            printf '%s\n' "$SSH_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: 📥 runner 侧拉取新订阅
        run: |
          set -euo pipefail
          curl -sL --max-time 60 -A 'clash-verge/v2.0.0' \
            "${{ secrets.PROXY_SUB_URL }}" -o /tmp/new-config.yaml
          chmod 644 /tmp/new-config.yaml
          echo "大小: $(wc -c < /tmp/new-config.yaml) bytes"
          grep -q '^proxies:' /tmp/new-config.yaml || {
            echo "❌ 订阅内容不含 proxies 段,格式不对" >&2
            head -5 /tmp/new-config.yaml >&2
            exit 1
          }
          grep -E '^(mixed-port|port|allow-lan):' /tmp/new-config.yaml | head -3

      - name: 🔍 诊断服务器代理现状
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" '
            echo "== 进程 =="; ps aux | grep -E "mihomo|clash" | grep -v grep | head -5 || true
            echo "== systemd =="; systemctl list-units --all 2>/dev/null | grep -iE "mihomo|clash" | head -3 || true
            echo "== docker =="; docker ps -a --format "{{.Names}} {{.Image}}" | grep -iE "mihomo|clash" || true
            echo "== 常见配置目录 =="; ls -la /etc/mihomo /root/.config/mihomo /opt/mihomo 2>/dev/null | head -20 || true
            echo "== docker daemon 代理配置 =="; cat /etc/systemd/system/docker.service.d/*.conf 2>/dev/null || echo "(无 drop-in)"
            echo "== 当前出站测试 =="; curl -s -o /dev/null -w "ghcr 直连: %{http_code}\n" --max-time 10 https://ghcr.io/v2/ || echo "ghcr 直连: 失败"
            curl -s -o /dev/null -w "本地 7890 代理: %{http_code}\n" --max-time 10 -x http://127.0.0.1:7890 https://ghcr.io/v2/ || echo "本地 7890 代理: 失败"
          '

      - name: 🔧 安装新配置并重启 mihomo
        if: inputs.verify_only != 'true'
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/new-config.yaml "$SSH_USER@$SSH_HOST:/tmp/mihomo-new-config.yaml"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SUDO=""; sudo -n true 2>/dev/null && SUDO="sudo"
          CFG_DIR=""
          for d in /etc/mihomo /root/.config/mihomo /opt/mihomo; do
            if [ -f "$d/config.yaml" ]; then CFG_DIR="$d"; break; fi
          done
          if [ -z "$CFG_DIR" ]; then
            echo "未找到现有配置目录,使用 /etc/mihomo"
            $SUDO mkdir -p /etc/mihomo
            CFG_DIR=/etc/mihomo
          fi
          echo "配置目录: $CFG_DIR"
          $SUDO cp "$CFG_DIR/config.yaml" "$CFG_DIR/config.yaml.bak.$(date +%s)" 2>/dev/null || true
          $SUDO install -m 644 /tmp/mihomo-new-config.yaml "$CFG_DIR/config.yaml"
          # 容器经 host.docker.internal 走代理,必须监听 LAN 口
          $SUDO sed -i "s/^allow-lan: false/allow-lan: true/" "$CFG_DIR/config.yaml"
          grep -E "^(mixed-port|allow-lan):" "$CFG_DIR/config.yaml" | head -2
          if [ -x "$CFG_DIR/mihomo" ]; then
            # 裸二进制部署:创建 systemd 单元(自愈 + 开机自启,替代手动拉起)
            $SUDO tee /etc/systemd/system/mihomo.service > /dev/null <<UNIT
          [Unit]
          Description=mihomo (Clash Meta) proxy
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=$CFG_DIR/mihomo -d $CFG_DIR
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable mihomo
            $SUDO systemctl restart mihomo && echo "已创建并启动 systemd mihomo"
          elif systemctl list-unit-files 2>/dev/null | grep -q "^mihomo"; then
            $SUDO systemctl restart mihomo && echo "已重启 systemd mihomo"
          elif docker ps -a --format "{{.Names}}" | grep -qiE "mihomo|clash"; then
            $SUDO docker restart $(docker ps -a --format "{{.Names}}" | grep -iE "mihomo|clash" | head -1) \
              && echo "已重启 docker mihomo"
          elif systemctl list-unit-files 2>/dev/null | grep -q "^clash"; then
            $SUDO systemctl restart clash && echo "已重启 systemd clash"
          else
            echo "❌ 未发现 mihomo/clash 部署方式,请人工确认" >&2
            exit 1
          fi
          sleep 5
          rm -f /tmp/mihomo-new-config.yaml
          REMOTE

      - name: ✅ 验证出站连通
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" '
            echo "== 代理进程 =="; ps aux | grep -E "mihomo|clash" | grep -v grep | head -3 || true
            echo "== 经 7890 访问 ghcr =="
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -x http://127.0.0.1:7890 https://ghcr.io/v2/ || echo "fail")
              echo "尝试 $i: HTTP $code"
              [ "$code" != "fail" ] && [ "$code" != "000" ] && break
              sleep 5
            done
            echo "== docker daemon 拉取测试 =="
            docker pull ghcr.io/indulgeback/telos-registry:sha-3902b80 >/dev/null 2>&1 \
              && echo "✅ docker pull 成功,daemon 出站已恢复" \
              || echo "❌ docker pull 失败,daemon 代理配置需人工检查 (/etc/systemd/system/docker.service.d/)"
          '
