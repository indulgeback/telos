name: 🔍 Basic Checks

# =============================================================================
# 前后端代码检查: lint + 单元测试 + 构建
#   - Node 端 (web + agent-service): 在根目录装 monorepo 依赖, 各自跑 lint/test/build
#   - Go 端 (api-gateway + registry + pkg/*): go vet + go build + go test
# =============================================================================

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支并发跑时取消旧的
concurrency:
  group: basic-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 前端 + Node 后端 检查 (web + agent-service)
  # ---------------------------------------------------------------------------
  node:
    name: 🟢 Node (web + agent-service)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 安装 monorepo 依赖 (根目录, --ignore-scripts 跳过 husky/prisma generate)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🗄️ 生成 Prisma Client (web + agent-service 共用根 schema)
        run: cd apps/web && npx prisma generate --schema ../../prisma/schema.prisma

      # ----- Web (Next.js) -----
      - name: 🔍 Web - ESLint
        run: pnpm --filter ./apps/web lint

      - name: 🎨 Web - Prettier 格式检查
        run: pnpm --filter ./apps/web format:check

      - name: 🧪 Web - 单元测试 (Vitest)
        run: pnpm --filter ./apps/web test

      - name: 🏗️ Web - 构建 (Next.js)
        run: pnpm --filter ./apps/web build
        env:
          # build 时需要 NEXT_PUBLIC_* 变量 (构建时内联, 留默认值即可, 不影响检查)
          NEXT_PUBLIC_API_URL: 'http://localhost:8890'
          NEXT_PUBLIC_BETTER_AUTH_URL: 'http://localhost:8800'

      # ----- Agent Service (Node/TypeScript) -----
      # 注: agent-service 未配置 ESLint (无 eslint.config + 无 eslint 依赖)
      # tsc build 已开启 strict 模式, 等效于类型检查
      - name: 🏗️ Agent Service - 构建 (TypeScript, strict 模式类型检查)
        run: pnpm --filter ./services/agent-service build

      - name: 🧪 Agent Service - 单元测试 (node:test)
        run: pnpm --filter ./services/agent-service test
        # 无 DATABASE_URL 时 diagnose 集成测试自动 skip

  # ---------------------------------------------------------------------------
  # Go 后端检查 (api-gateway + registry + pkg/tlog)
  # ---------------------------------------------------------------------------
  go:
    name: 🔵 Go (api-gateway + registry + pkg)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4 个真实存在的 Go 模块 (go.mod replace 指向 monorepo 相对路径)
        module:
          - apps/api-gateway
          - apps/registry
          - pkg/tlog
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: 📦 下载依赖
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: 🔍 静态分析 (go vet)
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: 🏗️ 构建检查
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: 🧪 单元测试
        working-directory: ${{ matrix.module }}
        run: go test ./... -v

  # ---------------------------------------------------------------------------
  # 结果汇总
  # ---------------------------------------------------------------------------
  summary:
    name: 📊 汇总
    runs-on: ubuntu-latest
    needs: [node, go]
    if: always()
    steps:
      - name: 📊 检查结果
        run: |
          echo "## 🔍 检查结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Node (web: lint+test+build / agent-service: build+test) | ${{ needs.node.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Go (api-gateway + registry + pkg: vet + test + build) | ${{ needs.go.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.node.result }}" == "success" && "${{ needs.go.result }}" == "success" ]]; then
            echo "🎉 所有检查通过！" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 有检查失败，请查看对应 job 的详细日志。" >> $GITHUB_STEP_SUMMARY
          fi
