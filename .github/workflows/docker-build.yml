name: 🐳 Build & Push Docker Images

# =============================================================================
# 镜像构建流水线
#   - push 到 main        → 推送 :main 与 :sha-<short> 标签
#   - 打 v* 形式的 tag    → 推送 :<version> 与 :latest 标签
# 6 个服务通过 matrix 并发构建
# =============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

# 防止同一分支并发构建造成镜像覆盖
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/telos

permissions:
  contents: read
  packages: write
  # 允许触发部署 workflow
  actions: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: 计算本次构建使用的镜像 tag,后续 job 共享
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: 📊 计算镜像标签
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 打 tag: v1.2.3 → 1.2.3
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "image_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "🏷️  Release 版本: ${VERSION}"
          else
            # push main 或手动触发:使用分支名
            BRANCH="${GITHUB_REF#refs/heads/}"
            # 规范化分支名(main 直接用,带 / 的换成 -)
            BRANCH="${BRANCH//\//-}"
            echo "image_tag=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "🏷️  分支构建: ${BRANCH}"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: matrix 并发构建 6 个服务镜像
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
            context: .
          - service: admin
            dockerfile: apps/admin/Dockerfile
            context: .
          - service: agent-service
            dockerfile: services/agent-service/Dockerfile
            context: .
          - service: admin-service
            dockerfile: services/admin-service/Dockerfile
            context: .
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
            context: .
          - service: registry
            dockerfile: apps/registry/Dockerfile
            context: .
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          # 始终构建触发本次 workflow 的精确 commit，避免 tag 与内容错配。
          ref: ${{ github.sha }}

      - name: 📦 设置 QEMU (多架构支持预留)
        uses: docker/setup-qemu-action@v3

      - name: 📦 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 生成镜像名称与标签
        id: image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}-${{ matrix.service }}"
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

          # 完整镜像引用列表
          TAGS="${IMAGE_LC}:${IMAGE_TAG}"
          TAGS="${TAGS},${IMAGE_LC}:sha-${GITHUB_SHA::7}"
          if [[ "$IS_RELEASE" == "true" ]]; then
            TAGS="${TAGS},${IMAGE_LC}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "🐳 构建: ${TAGS}"

      - name: 🏗️ 构建并推送镜像
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # GitHub Actions 缓存,大幅加速二次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 生成的镜像使用 buildx provenance 简化引用
          provenance: false
          load: false
          # web 镜像构建时注入 NEXT_PUBLIC_* (这些变量在 build 时内联进 bundle, 运行时注入无效)
          # 仅 web 服务会用到这些 ARG, 其他服务的 Dockerfile 不声明 ARG 会自动忽略
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.telos.indulgeback.icu' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://telos.indulgeback.icu' }}

      - name: 📝 输出镜像 digest
        run: |
          echo "✅ ${{ matrix.service }} 构建完成"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🐳 ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ needs.prepare.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 3: 触发部署 (push main 或 release tag 时自动触发)
  # ---------------------------------------------------------------------------
  trigger_deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 🚀 触发部署 workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const primaryTag = '${{ needs.prepare.outputs.image_tag }}'
            const isRelease = '${{ needs.prepare.outputs.is_release }}' === 'true'
            const tag = isRelease ? primaryTag : `sha-${context.sha.slice(0, 7)}`
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                image_tag: tag,
                build_sha: context.sha
              }
            })
            core.info(`✅ 已触发 deploy.yml,镜像 tag: ${tag}`)
