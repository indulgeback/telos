<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#dce6ed"/><rect x="70" y="65" width="820" height="510" rx="18" fill="#26343b"/><circle cx="102" cy="98" r="6" fill="#ed9a83"/><circle cx="125" cy="98" r="6" fill="#e8cb83"/><circle cx="148" cy="98" r="6" fill="#a5c6a1"/><text x="360" y="104" fill="#dce6ed" font-family="monospace" font-size="16" font-weight="400">small-things.ts</text><text x="110" y="190" fill="#b8d1b0" font-family="monospace" font-size="24" font-weight="400">const idea = await explore({</text><text x="110" y="233" fill="#e5cb9f" font-family="monospace" font-size="24" font-weight="400">  question: &#x27;What if we tried?&#x27;,</text><text x="110" y="276" fill="#e5cb9f" font-family="monospace" font-size="24" font-weight="400">  curiosity: true,</text><text x="110" y="319" fill="#b8d1b0" font-family="monospace" font-size="24" font-weight="400">})</text><text x="110" y="362" fill="#dce6ed" font-family="monospace" font-size="24" font-weight="400"></text><text x="110" y="405" fill="#b8d1b0" font-family="monospace" font-size="24" font-weight="400">const next = await make(idea)</text><text x="110" y="448" fill="#ebaca3" font-family="monospace" font-size="24" font-weight="400">return next</text><text x="110" y="535" fill="#a6b5bb" font-family="Arial" font-size="18" font-weight="400">A small idea. A working beginning.</text></svg>